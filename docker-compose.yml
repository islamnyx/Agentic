version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 5s
      retries: 5

  opa:
    image: openpolicyagent/opa:0.68.0
    ports:
      - "8181:8181"
    command: ["run", "--server", "--addr=0.0.0.0:8181"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8181/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://gateway:gateway@postgres:5432/gateway
      OPA_URL: http://opa:8181
      OPA_POLICY_PATH: /v1/data/gateway/allow
      SECRET_KEY: dev-secret-change-me
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      opa:
        condition: service_healthy
    volumes:
      - ./gateway:/app/gateway
    command: sh -c "alembic upgrade head && uvicorn gateway.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
